name: Market Data Stream Refresh

on:
  schedule:
    # Triggers automatically every 20 minutes (Universal Time Coordinated / UTC)
    - cron: '*/20 * * * *'
  workflow_dispatch:
    # Keeps the manual "Run workflow" button active just in case

jobs:
  refresh-indicators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-python: '3.10'
          cache: 'pip'

      - name: Install Architecture Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Execute Institutional Analytics Engine
        run: python update_stocks.py

      - name: Commit and Push Updated Matrix Vectors
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live_market.json
          git diff-index --quiet HEAD || git commit -m "Automated Matrix Sync: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          git push
